<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
        }
        #main{
            height: 400px;
            width: 400px;
            border: 2px solid black;
          
        }
        #a{
            height: 100px;
            width: 100px;
            background-color: red;
        }
         #b{
            height: 100px;
            width: 100px;
            background-color: blue;
            display: none;
        }
         #c{
            height: 100px;
            width: 100px;
            background-color: green;
        }
         #main1{
            height: 400px;
            width: 400px;
            border: 2px solid black;
        }
        #d{
            height: 100px;
            width: 100px;
            background-color: red;
        }
         #e{
            height: 100px;
            width: 100px;
            background-color: blue;
            visibility: hidden;
        }
         #f{
            height: 100px;
            width: 100px;
            background-color: green;
        }
        
    </style>
</head>
<body>
    <div id="main">
        <div id="a"></div>
        <div id="b"></div>
        <div id="c"></div>
    </div>
    <div id="main1">
        <div id="d"></div>
        <div id="e"></div>
        <div id="f"></div>
    </div>

</body>
</html>
