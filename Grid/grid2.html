<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .items{
            background-color: blue;
            color: white;
            font-size: 30px;
            text-align: center;
            line-height: 100px;
        }
        #grid-container{
            display: grid;
            grid-template-rows: repeat(3,100px);
            grid-template-columns: repeat(3,100px);  
            grid-template-areas: 
            "item6      item4       item7"
            "item8      item2       item2"
            "item3      item9       item5"
              ;
        }
        #item-1{
            grid-area: item1;
        }
         #item-2{
            grid-area: item2;
        }
         #item-3{
            grid-area: item3;
        }
         #item-4{
            grid-area: item4;
        }
         #item-5{
            grid-area: item5;
        }
         #item-6{
            grid-area: item6;
        }
         #item-7{
            grid-area: item7;
        }
         #item-8{
            grid-area: item8;
        }
          #item-9{
            grid-area: item9;
        }
    </style>
</head>
<body>
        <div id="grid-container">
        <!-- <div id="item-1" class="items">1</div> -->
        <div id="item-2" class="items">2</div>
        <div id="item-3" class="items">3</div>
        <div id="item-4" class="items">4</div>
        <div id="item-5" class="items">5</div>
        <div id="item-6" class="items">6</div>
        <div id="item-7" class="items">7</div>
        <div id="item-8" class="items">8</div>
        <div id="item-9" class="items">9</div>
        
    </div>
</body>
</html>
