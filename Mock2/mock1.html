
<!DOCTYPE html>
<html>
<head>
    <title>Netflix</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-image: url("360_F_481762281_Xcvl3QsGh1pBMvQuyKIoIqq8aYksXEwX.jpg");
            background-size: auto;
            color: white;
            background-repeat: no-repeat;
            background-size: cover;
        }
        #main {
            height: 100vh;
        }
        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
           padding: 30px;
        }
        #logo {
            color: red;
            font-size: 45px;
            font-weight: bold;
        }
        #right {
            align-items: center;
            gap: 50px;
        }
        #language:hover{
           background-color: transparent;
           color: white;
            border: 1px solid grey;
            padding: 10px 10px;
            font-size: 20px;
        }
        #signout:hover{
            background-color: red;
            color: white;
            padding: 11px 20px;
            font-size: 16px;
        }
        #content {
            text-align: center;
            margin-top: 200px;
        }
        #content h1 {
            font-size: 60px;

        }
      
        #button {
            background-color: red;
            color: white;
            border:2px solid red;
            padding: 20px 60px;
            font-size: 25px;
            font-weight: bolder;
            border-radius: 50px;
        }
        #searchbox{
            display: flex;
            align-items: center;
            color: white;
            padding: 100px 100px;
            height: 200vh;
           width: 200px;
        }
        
    </style>
</head>

<body>

    <div id="main">

        <header>

            <div id="logo">
                NETFLIX
            </div>

          
            <div id="searchbox">
                <input type="search" id="search" placeholder="search movies and series">
            </div>

            <div id="right">

                <select id="language">
                    <option>English</option>
                    <option>Hindi</option>
                </select>

                <button id="signout">
                    Sign Out
                </button>

            </div>

        </header>


        <div id="content">

            <h1>
                Unlimited movies,<br>
                shows, and more
            </h1>

           

            <button id="button">
                Start Your Membership:
            </button>

        </div>

    </div>

</body>
</html>
