<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Selector</title>
    <style>


        /* id */
        #a{
            color: green;
        }
        #b{
            color: aqua;
        }
        
           
        
        /* class */
        .c{
            background-color: brown;
        }


        /* tagname */
        h2{
            color: blue;
        }
        h3{
            color: yellow;
        }


        /* grouping */
        h4,h5,h6{
            color: chocolate;
        }


       

        /* universal */
        *{
            color: red;
            background-color: aquamarine;
        }


    </style>
</head>
<body>

    <!-- id -->
     <h1 id="a">Lorem ipsum dolor sit amet.</h1>
     <h1 id="b">Lorem ipsum dolor sit amet.</h1>

     <!-- class -->
      <p class = "c">Lorem ipsum dolor sit amet.</p>
      <div class="c">Lorem ipsum dolor sit amet.</div>
      <main class="c">Lorem ipsum dolor sit amet.</main>

      <!-- tagname -->
       <h2>Lorem ipsum dolor sit amet.</h2>
       <h3>Lorem ipsum dolor sit amet.</h3>

       <!-- grouping -->
        <h4>Lorem ipsum dolor sit amet.</h4>
        <h5>Lorem ipsum dolor sit amet.</h5>
        <h6>Lorem ipsum dolor sit amet.</h6>

</body>
</html>
