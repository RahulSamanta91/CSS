<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;

        }

        #main{
            width: 100%;
            height: 75px;
            background-color: aqua;
        }

        #main nav{
            width: 80%;
            height: inherit;
            margin: auto;
        }

        #main nav ul{
            display: flex;
            justify-content: space-between;
            height: inherit;
            align-items: center;
            list-style: none;

        }
    </style>
</head>
<body>
    <section id="main">
        <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <li>Help</li>
        </ul>
        </nav>
    </section>
</body>
</html>
